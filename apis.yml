aid: basata
name: Basata
description: >-
  Basata is a Phoenix-based healthcare AI company building the operational layer
  for American medical practices. Its AI agents automate back-office
  administrative work — processing patient referrals, answering phone calls 24/7,
  and managing faxes and patient communications — while integrating with existing
  EHR systems so clinical staff can focus on patient care instead of paperwork.
  Founded in 2024 by Kaled Alhanafi (CEO, formerly Lyft and Cruise), Chetan Patel
  (co-founder and president, formerly Medtronic), and Vivin Paliath (co-founder
  and CTO), Basata raised a $21M Series A led by Basis Set Ventures with Cowboy
  Ventures and PHX Ventures participating (~$24.5M total). The platform is marketed
  as fully HIPAA-compliant and the company publishes a SOC 2 attestation. Basata
  does not currently expose a public developer API or documentation surface; this
  profile captures its public identity and web properties.
